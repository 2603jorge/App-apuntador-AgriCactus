name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev
          pip install buildozer cython==0.29.33

      - name: Cache Buildozer global
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-apuntador-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-apuntador-v2-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-apuntador-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: gradle-apuntador-v2-

      - name: Instalar Android SDK correcto
        run: |
          mkdir -p ~/.buildozer/android/platform
          cd ~/.buildozer/android/platform

          # Instalar cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip -d android-sdk-tmp
          mkdir -p android-sdk/cmdline-tools
          mv android-sdk-tmp/cmdline-tools android-sdk/cmdline-tools/latest
          rm -rf android-sdk-tmp commandlinetools-linux-9477386_latest.zip

          export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools

          # Aceptar licencias e instalar paquetes necesarios
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools"

      - name: Limpiar build anterior
        run: |
          rm -rf .buildozer/android/platform/build-arm64-v8a/dists
          rm -rf .buildozer/android/platform/build-arm64-v8a/build/other_builds/hostpython3

      - name: Build APK
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee build_output.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "BUILD FAILED"
            tail -100 build_output.log
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apuntador-agricactus-apk
          path: bin/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: build_output.log

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-apuntador
          name: "AgriCactus Apuntador v${{ github.run_number }}"
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
